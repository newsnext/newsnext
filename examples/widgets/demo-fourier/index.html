<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fourier</title>
  <!-- The daemon injects its built-in stylesheet (/widgets/newsnext.css) into
       every served HTML document; it provides the NewsNext semantic tokens
       and base document styles, so this document only adds its own content
       styles. -->
  <style>
    /* The host owns the shell, surface, scroll container, and status layer, so
       this document only styles its own content. The runtime (fill mode)
       pins #root to the exact content-panel height; the document never
       scrolls on its own. */
    #root {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }
    .readout {
      min-width: 0;
      margin-right: auto;
    }
    .readout-name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .readout-meta {
      font-size: 12px;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .group-label {
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .seg {
      display: flex;
      padding: 2px;
      gap: 2px;
      border-radius: 999px;
      background-color: var(--track);
    }
    .seg button {
      border: 0;
      padding: 3px 9px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background-color: var(--muted);
      color: var(--foreground);
      font-weight: 600;
    }
    .seg button:focus-visible,
    .stepper button:focus-visible {
      outline: 2px solid var(--line);
      outline-offset: 2px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: 999px;
      background-color: var(--track);
    }
    .stepper button {
      width: 24px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:hover { background-color: var(--hover); }
    .stepper output {
      min-width: 3ch;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .stage {
      position: relative;
      flex: 1 1 0;
      min-height: 120px;
    }
    .stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module">
    import { createView } from "/widgets/newsnext.js"

    // Fourier series of three classic waveforms, expressed as sine terms
    // (amplitude, harmonic) so one epicycle renderer serves all of them.
    function seriesTerms(kind, count) {
      const terms = []
      if (kind === "square") {
        for (let n = 1; terms.length < count; n += 2) {
          terms.push({ amp: 4 / (Math.PI * n), freq: n })
        }
      } else if (kind === "sawtooth") {
        for (let n = 1; terms.length < count; n += 1) {
          terms.push({ amp: (2 / (Math.PI * n)) * (n % 2 === 1 ? 1 : -1), freq: n })
        }
      } else {
        for (let n = 1; terms.length < count; n += 2) {
          const sign = ((n - 1) / 2) % 2 === 0 ? 1 : -1
          terms.push({ amp: (8 / (Math.PI * Math.PI * n * n)) * sign, freq: n })
        }
      }
      return terms
    }

    const FORMULAS = {
      square: "y = Σ 4/(πn)·sin(nθ), n odd",
      sawtooth: "y = Σ 2(−1)ⁿ⁺¹/(πn)·sin(nθ)",
      triangle: "y = Σ 8(−1)⁽ⁿ⁻¹⁾ᐟ²/(π²n²)·sin(nθ), n odd",
    }

    const state = {
      kind: "square",
      terms: 7,
      speed: 1,
      playing: !window.matchMedia("(prefers-reduced-motion: reduce)").matches,
      phase: 0,
      trace: [],
    }

    function palette() {
      // Canvas cannot resolve var(), so read the semantic tokens once per
      // frame; fallbacks keep the drawing legible if a token is missing.
      const css = getComputedStyle(document.documentElement)
      const get = (name, fallback) => {
        const value = css.getPropertyValue(name).trim()
        return value || fallback
      }
      return {
        fg: get("--foreground", "#e8e8e8"),
        muted: get("--muted-foreground", "#8a8a8a"),
        faint: get("--border", "#3a3a3a"),
        accent: "oklch(76% 0.13 195)",
      }
    }

    let root = null
    let readoutName = null
    let readoutMeta = null
    let canvas = null
    let ctx = null
    let playButton = null
    let raf = 0
    let lastTick = 0

    function resetTrace() {
      state.trace.length = 0
    }

    function updateReadout() {
      if (!readoutName) return
      readoutName.textContent = `${state.kind === "square" ? "Square" : state.kind === "sawtooth" ? "Sawtooth" : "Triangle"} · N=${state.terms}`
      readoutMeta.textContent = FORMULAS[state.kind]
    }

    function buildToolbar(host) {
      const bar = document.createElement("div")
      bar.className = "toolbar"

      const readout = document.createElement("div")
      readout.className = "readout"
      readoutName = document.createElement("div")
      readoutName.className = "readout-name"
      readoutMeta = document.createElement("div")
      readoutMeta.className = "readout-meta"
      readout.append(readoutName, readoutMeta)
      bar.append(readout)

      const kindSeg = document.createElement("div")
      kindSeg.className = "seg"
      kindSeg.setAttribute("role", "group")
      kindSeg.setAttribute("aria-label", "Waveform")
      for (const kind of ["square", "sawtooth", "triangle"]) {
        const button = document.createElement("button")
        button.type = "button"
        button.textContent = kind === "square" ? "Square" : kind === "sawtooth" ? "Saw" : "Tri"
        button.title = kind
        button.setAttribute("aria-pressed", String(state.kind === kind))
        button.addEventListener("click", () => {
          if (state.kind === kind) return
          state.kind = kind
          for (const child of kindSeg.children) child.setAttribute("aria-pressed", String(child === button))
          resetTrace()
          updateReadout()
        })
        kindSeg.append(button)
      }
      bar.append(kindSeg)

      const stepper = document.createElement("div")
      stepper.className = "stepper"
      stepper.setAttribute("role", "group")
      stepper.setAttribute("aria-label", "Series terms")
      const down = document.createElement("button")
      down.type = "button"
      down.textContent = "−"
      down.setAttribute("aria-label", "Fewer terms")
      const out = document.createElement("output")
      out.textContent = `N=${state.terms}`
      const up = document.createElement("button")
      up.type = "button"
      up.textContent = "+"
      up.setAttribute("aria-label", "More terms")
      const setTerms = (next) => {
        state.terms = Math.min(25, Math.max(1, next))
        out.textContent = `N=${state.terms}`
        resetTrace()
        updateReadout()
      }
      down.addEventListener("click", () => setTerms(state.terms - 1))
      up.addEventListener("click", () => setTerms(state.terms + 1))
      stepper.append(down, out, up)
      bar.append(stepper)

      const speedSeg = document.createElement("div")
      speedSeg.className = "seg"
      speedSeg.setAttribute("role", "group")
      speedSeg.setAttribute("aria-label", "Speed")
      for (const speed of [0.5, 1, 2]) {
        const button = document.createElement("button")
        button.type = "button"
        button.textContent = `${speed}×`
        button.setAttribute("aria-pressed", String(state.speed === speed))
        button.addEventListener("click", () => {
          state.speed = speed
          for (const child of speedSeg.children) child.setAttribute("aria-pressed", String(child === button))
        })
        speedSeg.append(button)
      }
      bar.append(speedSeg)

      playButton = document.createElement("button")
      playButton.type = "button"
      playButton.textContent = state.playing ? "Pause" : "Play"
      playButton.setAttribute("aria-label", "Toggle animation")
      // Reuse the segmented look for a single action.
      playButton.className = ""
      const playWrap = document.createElement("div")
      playWrap.className = "seg"
      playWrap.append(playButton)
      playButton.addEventListener("click", () => {
        state.playing = !state.playing
        playButton.textContent = state.playing ? "Pause" : "Play"
        if (state.playing) {
          lastTick = performance.now()
          raf = requestAnimationFrame(tick)
        } else {
          cancelAnimationFrame(raf)
        }
      })
      bar.append(playWrap)

      return bar
    }

    function fitCanvas() {
      if (!canvas || !ctx) return { w: 0, h: 0 }
      const rect = canvas.getBoundingClientRect()
      const dpr = Math.min(2, window.devicePixelRatio || 1)
      const w = Math.max(1, Math.round(rect.width * dpr))
      const h = Math.max(1, Math.round(rect.height * dpr))
      if (canvas.width !== w || canvas.height !== h) {
        canvas.width = w
        canvas.height = h
        resetTrace()
      }
      return { w, h }
    }

    function draw(now) {
      if (!ctx) return
      const { w, h } = fitCanvas()
      if (w < 10 || h < 10) return
      const c = palette()
      const dpr = Math.min(2, window.devicePixelRatio || 1)
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      const W = w / dpr
      const H = h / dpr
      ctx.clearRect(0, 0, W, H)

      const terms = seriesTerms(state.kind, state.terms)
      const maxAmp = terms.reduce((sum, t) => sum + Math.abs(t.amp), 0) || 1

      // Left pane holds the epicycle chain, right pane the scrolling trace.
      const gutter = 12
      const split = W < 300 ? 0.5 : 0.42
      const chainCX = (W * split) / 2
      const chainCY = H / 2
      const scale = Math.min((W * split) / 2 - gutter, H / 2 - gutter) / maxAmp
      const traceX = W * split + gutter
      const traceW = W - traceX - gutter

      // Epicycle chain: each term is a rotating vector; the tip's vertical
      // displacement is the partial sum of the Fourier series.
      let x = chainCX
      let y = chainCY
      ctx.lineWidth = 1
      for (const { amp, freq } of terms) {
        const r = Math.abs(amp) * scale
        const angle = freq * state.phase
        ctx.strokeStyle = c.faint
        ctx.beginPath()
        ctx.arc(x, y, Math.max(0.5, r), 0, Math.PI * 2)
        ctx.stroke()
        const nx = x + r * Math.cos(angle) * Math.sign(amp)
        const ny = y + r * Math.sin(angle) * Math.sign(amp)
        ctx.strokeStyle = c.muted
        ctx.beginPath()
        ctx.moveTo(x, y)
        ctx.lineTo(nx, ny)
        ctx.stroke()
        x = nx
        y = ny
      }
      ctx.fillStyle = c.accent
      ctx.beginPath()
      ctx.arc(x, y, 3, 0, Math.PI * 2)
      ctx.fill()

      // Connector from the chain tip to the trace head.
      ctx.strokeStyle = c.faint
      ctx.setLineDash([4, 4])
      ctx.beginPath()
      ctx.moveTo(x, y)
      ctx.lineTo(traceX, y)
      ctx.stroke()
      ctx.setLineDash([])

      // Trace: newest sample at the head, history scrolls left.
      state.trace.unshift(y)
      const maxSamples = Math.max(2, Math.floor(traceW))
      if (state.trace.length > maxSamples) state.trace.length = maxSamples
      ctx.strokeStyle = c.accent
      ctx.lineWidth = 1.5
      ctx.beginPath()
      state.trace.forEach((ty, i) => {
        const px = traceX + i
        if (i === 0) ctx.moveTo(px, ty)
        else ctx.lineTo(px, ty)
      })
      ctx.stroke()
      ctx.lineWidth = 1

      // Baseline and ideal-waveform ghost for comparison.
      ctx.strokeStyle = c.faint
      ctx.beginPath()
      ctx.moveTo(traceX, chainCY)
      ctx.lineTo(W - gutter, chainCY)
      ctx.stroke()
    }

    function tick(now) {
      if (!state.playing) return
      const dt = Math.min(0.05, (now - lastTick) / 1000 || 0)
      lastTick = now
      // One full waveform period every ~4s at 1×.
      state.phase += dt * state.speed * ((Math.PI * 2) / 4)
      if (state.phase > Math.PI * 2) {
        state.phase -= Math.PI * 2
        resetTrace()
      }
      draw(now)
      raf = requestAnimationFrame(tick)
    }

    const host = document.getElementById("root")
    root = host

    // Data-free view: the visualization is synthesized locally and ignores
    // the data payload; the host still owns loading/error presentation.
    createView({
      root: host,
      fill: true,
      render(frame) {
        frame.reportStatus(null)
        if (!canvas) {
          host.append(buildToolbar(host))
          const stage = document.createElement("div")
          stage.className = "stage"
          canvas = document.createElement("canvas")
          canvas.setAttribute("aria-label", "Fourier series visualization")
          canvas.setAttribute("role", "img")
          stage.append(canvas)
          host.append(stage)
          ctx = canvas.getContext("2d")
          updateReadout()
          draw(performance.now())
          if (state.playing) {
            lastTick = performance.now()
            raf = requestAnimationFrame(tick)
          }
        } else {
          draw(performance.now())
        }
      },
    })
  </script>
</body>
</html>
