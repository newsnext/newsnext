<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clock</title>
  <!-- The daemon injects its built-in stylesheet (/widgets/newsnext.css) into
       every served HTML document; it provides the NewsNext semantic tokens
       and base document styles, so this document only adds its own content
       styles. -->
  <style>
    /* The host owns the shell, surface, scroll container, and status layer, so
       this document only styles its own content. The runtime (fill mode)
       pins #root to the exact content-panel height; the document never
       scrolls on its own. */
    #root {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
      height: 100%;
      padding: 16px 20px;
    }
    .top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
    }
    .weekday {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.8;
    }
    .date {
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .time {
      display: flex;
      align-items: baseline;
      gap: 6px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .time-main {
      font-weight: 650;
      letter-spacing: -0.03em;
    }
    .time-sec {
      font-weight: 500;
      color: var(--muted-foreground);
    }
    .bottom-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .track {
      flex: 1;
      min-width: 0;
      height: 6px;
      border-radius: 999px;
      background-color: var(--track);
      overflow: hidden;
    }
    .fill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background-color: var(--line);
    }
    .day-label {
      flex: none;
      font-size: 12px;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module">
    import { createView } from "/widgets/newsnext.js"

    const root = document.getElementById("root")

    const topRow = document.createElement("div")
    topRow.className = "top-row"
    const weekdayEl = document.createElement("span")
    weekdayEl.className = "weekday"
    const dateEl = document.createElement("time")
    dateEl.className = "date"
    topRow.append(weekdayEl, dateEl)

    const timeEl = document.createElement("div")
    timeEl.className = "time"
    const mainEl = document.createElement("span")
    mainEl.className = "time-main"
    const secEl = document.createElement("span")
    secEl.className = "time-sec"
    timeEl.append(mainEl, secEl)

    const bottomRow = document.createElement("div")
    bottomRow.className = "bottom-row"
    const track = document.createElement("div")
    track.className = "track"
    const fill = document.createElement("span")
    fill.className = "fill"
    track.append(fill)
    const dayLabel = document.createElement("span")
    dayLabel.className = "day-label"
    bottomRow.append(track, dayLabel)

    root.append(topRow, timeEl, bottomRow)

    const timeFormat = new Intl.DateTimeFormat(undefined, {
      hour: "2-digit",
      minute: "2-digit",
    })
    const secFormat = new Intl.DateTimeFormat(undefined, { second: "2-digit" })
    const weekdayFormat = new Intl.DateTimeFormat(undefined, { weekday: "long" })
    const dateFormat = new Intl.DateTimeFormat(undefined, {
      month: "long",
      day: "numeric",
    })
    const percentFormat = new Intl.NumberFormat(undefined, { maximumFractionDigits: 0 })

    function tick() {
      const now = new Date()
      weekdayEl.textContent = weekdayFormat.format(now)
      dateEl.textContent = dateFormat.format(now)
      dateEl.dateTime = now.toISOString()
      mainEl.textContent = timeFormat.format(now)
      secEl.textContent = secFormat.format(now)
      // Minute progress keeps the bar moving every second.
      const progress = (now.getSeconds() * 1000 + now.getMilliseconds()) / 60000
      fill.style.width = `${(progress * 100).toFixed(1)}%`
      // Share of the day that has passed.
      const dayShare = (now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds()) / 86400
      dayLabel.textContent = `${percentFormat.format(dayShare * 100)}% of day`
    }

    tick()
    setInterval(tick, 250)

    // Data-free view: the clock renders immediately and ignores the data
    // payload; the host still owns loading/error presentation.
    createView({
      root,
      fill: true,
      render(frame) {
        frame.reportStatus(null)
        const wide = frame.span && frame.span.w >= 3
        mainEl.style.fontSize = wide ? "76px" : "60px"
        secEl.style.fontSize = wide ? "26px" : "22px"
        tick()
      },
    })
  </script>
</body>
</html>
