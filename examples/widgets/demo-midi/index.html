<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIDI Keys</title>
  <!-- The daemon injects its built-in stylesheet (/widgets/newsnext.css) into
       every served HTML document; it provides the NewsNext semantic tokens
       and base document styles, so this document only adds its own content
       styles. -->
  <style>
    /* The host owns the shell, surface, scroll container, and status layer, so
       this document only styles its own content. The runtime (fill mode)
       pins #root to the exact content-panel height; the document never
       scrolls on its own. */
    #root {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
    }
    .readout {
      min-width: 0;
      margin-right: auto;
    }
    .readout-name {
      font-size: 16px;
      font-weight: 650;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .readout-meta {
      font-size: 12px;
      color: var(--muted-foreground);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .group {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .group-label {
      font-size: 12px;
      color: var(--muted-foreground);
    }
    .seg {
      display: flex;
      padding: 2px;
      gap: 2px;
      border-radius: 999px;
      background-color: var(--track);
    }
    .seg button {
      border: 0;
      padding: 3px 9px;
      border-radius: 999px;
      background: transparent;
      color: var(--muted-foreground);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .seg button[aria-pressed="true"] {
      background-color: var(--muted);
      color: var(--foreground);
      font-weight: 600;
    }
    .seg button:focus-visible,
    .stepper button:focus-visible,
    .white:focus-visible,
    .black:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid var(--line);
      outline-offset: 2px;
    }
    .stepper {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 2px;
      border-radius: 999px;
      background-color: var(--track);
    }
    .stepper button {
      width: 24px;
      height: 22px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--foreground);
      font: inherit;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
    }
    .stepper button:hover { background-color: var(--hover); }
    .stepper output {
      min-width: 3ch;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      width: 84px;
      accent-color: var(--foreground);
    }
    .keyboard {
      position: relative;
      flex: 1 1 0;
      min-height: 120px;
    }
    .whites {
      display: flex;
      gap: 4px;
      height: 100%;
    }
    .white {
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 8px;
      border: 1px solid var(--border);
      border-radius: 0 0 10px 10px;
      background-color: color-mix(in oklab, var(--foreground) 3%, transparent);
      color: var(--muted-foreground);
      font: inherit;
      font-size: 11px;
      font-variant-numeric: tabular-nums;
      cursor: pointer;
      transition: background-color var(--duration) var(--ease);
    }
    .white:hover { background-color: var(--hover); }
    .white.active { background-color: var(--area); color: var(--foreground); }
    .blacks {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .black {
      position: absolute;
      top: 0;
      height: 58%;
      border: 0;
      border-radius: 0 0 7px 7px;
      background-color: var(--foreground);
      cursor: pointer;
      pointer-events: auto;
      transition: opacity var(--duration) var(--ease);
    }
    .black:hover { opacity: 0.82; }
    .black.active { opacity: 0.62; }
    .hint {
      font-size: 12px;
      color: var(--muted-foreground);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @media (prefers-reduced-motion: reduce) {
      .white, .black { transition: none; }
    }
  </style>
</head>
<body>
  <main id="root"></main>
  <script type="module">
    import { createView } from "/widgets/newsnext.js"

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"]
    const WHITE_OFFSETS = [0, 2, 4, 5, 7, 9, 11]
    const KEY_MAP = { a: 0, w: 1, s: 2, e: 3, d: 4, f: 5, t: 6, g: 7, y: 8, h: 9, u: 10, j: 11, k: 12, o: 13, l: 14, p: 15, ";": 16 }

    const state = { octave: 4, wave: "triangle", volume: 0.6, octaves: 1, last: null }
    let audio = null
    let master = null
    const voices = new Map()
    const keyNodes = new Map()

    function ensureAudio() {
      if (!audio) {
        audio = new (window.AudioContext || window.webkitAudioContext)()
        master = audio.createGain()
        master.gain.value = state.volume
        master.connect(audio.destination)
      }
      if (audio.state === "suspended") audio.resume()
      return audio
    }

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12)
    }

    function noteName(midi) {
      return `${NOTE_NAMES[((midi % 12) + 12) % 12]}${Math.floor(midi / 12) - 1}`
    }

    function noteOn(midi) {
      ensureAudio()
      if (voices.has(midi)) return
      const osc = audio.createOscillator()
      const gain = audio.createGain()
      osc.type = state.wave
      osc.frequency.value = midiToFreq(midi)
      const now = audio.currentTime
      gain.gain.setValueAtTime(0, now)
      gain.gain.linearRampToValueAtTime(0.9, now + 0.008)
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.25)
      osc.connect(gain).connect(master)
      osc.start()
      voices.set(midi, { osc, gain })
      state.last = midi
      keyNodes.get(midi)?.classList.add("active")
      updateReadout()
    }

    function noteOff(midi) {
      const voice = voices.get(midi)
      keyNodes.get(midi)?.classList.remove("active")
      if (!voice) return
      voices.delete(midi)
      const now = audio.currentTime
      voice.gain.gain.cancelScheduledValues(now)
      voice.gain.gain.setValueAtTime(Math.max(0.001, voice.gain.gain.value), now)
      voice.gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15)
      voice.osc.stop(now + 0.18)
    }

    let readoutName = null
    let readoutMeta = null

    function updateReadout() {
      if (!readoutName) return
      if (state.last == null) {
        readoutName.textContent = "Ready"
        readoutMeta.textContent = `C${state.octave} – B${state.octave + state.octaves - 1} · play with pointer or keys A–K`
        return
      }
      readoutName.textContent = noteName(state.last)
      readoutMeta.textContent = `${midiToFreq(state.last).toFixed(1)} Hz · MIDI ${state.last} · ${state.wave}`
    }

    function buildToolbar(host) {
      const bar = document.createElement("div")
      bar.className = "toolbar"

      const readout = document.createElement("div")
      readout.className = "readout"
      readoutName = document.createElement("div")
      readoutName.className = "readout-name"
      readoutMeta = document.createElement("div")
      readoutMeta.className = "readout-meta"
      readout.append(readoutName, readoutMeta)
      bar.append(readout)

      const waveGroup = document.createElement("div")
      waveGroup.className = "group"
      waveGroup.setAttribute("role", "group")
      waveGroup.setAttribute("aria-label", "Waveform")
      const seg = document.createElement("div")
      seg.className = "seg"
      for (const wave of ["sine", "triangle", "square", "sawtooth"]) {
        const button = document.createElement("button")
        button.type = "button"
        button.textContent = wave === "sawtooth" ? "saw" : wave === "triangle" ? "tri" : wave === "square" ? "sqr" : "sin"
        button.title = wave
        button.setAttribute("aria-pressed", String(state.wave === wave))
        button.addEventListener("click", () => {
          state.wave = wave
          for (const child of seg.children) child.setAttribute("aria-pressed", String(child === button))
          updateReadout()
        })
        seg.append(button)
      }
      waveGroup.append(seg)
      bar.append(waveGroup)

      const stepper = document.createElement("div")
      stepper.className = "stepper"
      stepper.setAttribute("role", "group")
      stepper.setAttribute("aria-label", "Octave")
      const down = document.createElement("button")
      down.type = "button"
      down.textContent = "−"
      down.setAttribute("aria-label", "Octave down")
      const out = document.createElement("output")
      out.textContent = `C${state.octave}`
      const up = document.createElement("button")
      up.type = "button"
      up.textContent = "+"
      up.setAttribute("aria-label", "Octave up")
      const setOctave = (next) => {
        state.octave = Math.min(6, Math.max(1, next))
        out.textContent = `C${state.octave}`
        buildKeyboard(host)
        updateReadout()
      }
      down.addEventListener("click", () => setOctave(state.octave - 1))
      up.addEventListener("click", () => setOctave(state.octave + 1))
      stepper.append(down, out, up)
      bar.append(stepper)

      const volGroup = document.createElement("div")
      volGroup.className = "group"
      const volLabel = document.createElement("span")
      volLabel.className = "group-label"
      volLabel.textContent = "Vol"
      const vol = document.createElement("input")
      vol.type = "range"
      vol.min = "0"
      vol.max = "100"
      vol.value = String(Math.round(state.volume * 100))
      vol.setAttribute("aria-label", "Volume")
      vol.addEventListener("input", () => {
        state.volume = Number(vol.value) / 100
        if (master) master.gain.value = state.volume
      })
      volGroup.append(volLabel, vol)
      bar.append(volGroup)

      return bar
    }

    function buildKeyboard(host) {
      const old = host.querySelector(".keyboard")
      if (old) old.remove()
      keyNodes.clear()
      for (const midi of [...voices.keys()]) noteOff(midi)

      const base = (state.octave + 1) * 12
      const keyboard = document.createElement("div")
      keyboard.className = "keyboard"
      const whites = document.createElement("div")
      whites.className = "whites"
      const blacks = document.createElement("div")
      blacks.className = "blacks"
      keyboard.append(whites, blacks)

      const whiteIndex = new Map()
      let whiteCount = 0
      for (let o = 0; o < state.octaves; o++) {
        for (const offset of WHITE_OFFSETS) {
          whiteIndex.set(o * 12 + offset, whiteCount++)
        }
      }

      const press = (midi) => noteOn(midi)
      const release = (midi) => noteOff(midi)

      for (let o = 0; o < state.octaves; o++) {
        for (const offset of WHITE_OFFSETS) {
          const midi = base + o * 12 + offset
          const key = document.createElement("button")
          key.type = "button"
          key.className = "white"
          key.textContent = NOTE_NAMES[offset]
          key.setAttribute("aria-label", noteName(midi))
          key.addEventListener("pointerdown", (event) => {
            event.preventDefault()
            key.setPointerCapture(event.pointerId)
            press(midi)
          })
          key.addEventListener("pointerup", () => release(midi))
          key.addEventListener("pointercancel", () => release(midi))
          key.addEventListener("lostpointercapture", () => release(midi))
          key.addEventListener("keydown", (event) => {
            if ((event.key === " " || event.key === "Enter") && !event.repeat) press(midi)
          })
          key.addEventListener("keyup", () => release(midi))
          key.addEventListener("blur", () => release(midi))
          keyNodes.set(midi, key)
          whites.append(key)
        }
      }

      // Black keys are positioned between neighboring white keys.
      // Percentage positioning stays correct when the card resizes.
      const whiteEls = [...whites.children]
      for (let o = 0; o < state.octaves; o++) {
        for (const offset of [1, 3, 6, 8, 10]) {
          const midi = base + o * 12 + offset
          const leftWhite = whiteIndex.get(o * 12 + offset - 1)
          if (leftWhite === undefined || !whiteEls[leftWhite]) continue
          const edge = ((leftWhite + 1) / whiteCount) * 100
          const key = document.createElement("button")
          key.type = "button"
          key.className = "black"
          key.setAttribute("aria-label", noteName(midi))
          key.style.left = `calc(${edge}% - 0.85em)`
          key.style.width = "1.7em"
          key.addEventListener("pointerdown", (event) => {
            event.preventDefault()
            event.stopPropagation()
            key.setPointerCapture(event.pointerId)
            press(midi)
          })
          key.addEventListener("pointerup", () => release(midi))
          key.addEventListener("pointercancel", () => release(midi))
          key.addEventListener("lostpointercapture", () => release(midi))
          key.addEventListener("blur", () => release(midi))
          keyNodes.set(midi, key)
          blacks.append(key)
        }
      }

      const hint = host.querySelector(".hint")
      if (hint) host.insertBefore(keyboard, hint)
      else host.append(keyboard)
    }

    window.addEventListener("keydown", (event) => {
      if (event.metaKey || event.ctrlKey || event.altKey) return
      const target = event.target
      if (target instanceof HTMLInputElement || target instanceof HTMLTextAreaElement) return
      const offset = KEY_MAP[event.key.toLowerCase()]
      if (offset === undefined || event.repeat) return
      event.preventDefault()
      noteOn((state.octave + 1) * 12 + offset)
    })
    window.addEventListener("keyup", (event) => {
      const offset = KEY_MAP[event.key.toLowerCase()]
      if (offset === undefined) return
      noteOff((state.octave + 1) * 12 + offset)
    })

    const root = document.getElementById("root")
    let toolbar = null
    let hint = null

    // Data-free view: the instrument renders immediately and ignores the
    // data payload; the host still owns loading/error presentation.
    createView({
      root,
      fill: true,
      render(frame) {
        frame.reportStatus(null)
        const nextOctaves = frame.span && frame.span.w >= 3 ? 2 : 1
        if (!toolbar) {
          toolbar = buildToolbar(root)
          root.append(toolbar)
          hint = document.createElement("p")
          hint.className = "hint"
          hint.textContent = "Pointer or computer keys A–K play · WebAudio synth, no data needed"
          root.append(hint)
        }
        if (nextOctaves !== state.octaves) {
          state.octaves = nextOctaves
          buildKeyboard(root)
        }
        if (!root.querySelector(".keyboard")) buildKeyboard(root)
        updateReadout()
      },
    })
  </script>
</body>
</html>
