[workspace]
members = [ "apps/cli-rs" ]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MPL-2.0"
version = "1.0.0-beta.3"

[workspace.dependencies]
clap = { version = "4.5.45", features = [ "derive" ] }
chrono = "0.4.42"
ctrlc = "3.4.7"
http = "1.3.1"
notify = "8.2.0"
serde = { version = "1.0.219", features = [ "derive" ] }
serde_json = "1.0.143"
tao = "0.36.0"
tokio = { version = "1.47.1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time"
] }
tray-icon = "0.24.2"
ts-rs = { version = "12.0.1", features = [ "serde-compat" ] }
url = "2.5.7"
uuid = { version = "1.18.1", features = [ "v4" ] }
